hyper_parameter:
  learning_rate: 0.0001  # 1e-4 -> 1.0e-4 for float representation
  clip_len: 32
  ratio_ssi: 1
  ratio_tgm: 10
  epochs: 100
  batch_size: 1  # 4 -> 2로 줄여서 메모리 사용량 감소
  update_frequency: 6  # N 프레임마다 가중치 업데이트 (스트리밍용)
  
  # Teacher-Student parameters
  pred_distill_weight: 1.0  # Distillation loss 가중치
  cache_distill_weight: 1.0    # Feature distillation loss 가중치 (0.1 -> 0.01로 더욱 감소)

# KD Aux configuration (NEW: Spatial-Aware Enhancement)
kd_aux:
  enabled: true
  layers: [0, 1, 2, 3]  # 4 temporal module locations
  N: 1                  # APC future prediction steps
  alpha: 0.01           # L_DIS weight (feature distillation)
  beta: 0.0005          # L_KLD weight (attention relation)
  gamma: 0.005          # L_APC weight (autoregressive predictive coding)
  lambda_kd: 1.0        # Overall KD loss weight
  attn_eps: 1.0e-8      # Attention stability epsilon
  feature_pool: "mean"  # Pooling method for temporal features
  window: 16            # KD sliding window size (frames)
  stride: 1             # KD computation stride
  
  # C: Dynamic KV Refinement (Video-specific enhancement)
  use_kv_refiner: true          # Enable KV refinement
  kv_refiner_context: 4         # Number of context frames for refinement
  kv_refiner_dropout: 0.1       # Dropout rate in refiner
  zeta: 0.05                    # L_AUX_KV loss weight
  kv_loss_type: "mse"           # KV loss: 'mse' or 'cosine'
  kv_normalize: true            # Normalize K/V before loss computation